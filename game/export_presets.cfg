; Hexcom — the one export preset. Windows desktop, release, x86_64.
;
; This file is committed on purpose, which is why `game/export_presets.cfg` is no longer in
; `.gitignore`: the export is a standing job that Master runs after every round of sessions
; with no View session awake, and a preset it has to recreate by hand is not a job it can run.
; See `docs/decisions.md` entry 055, and `## Shipping it` in `docs/subprojects/view.md` for
; the command.
;
; The output is a single file. `binary_format/embed_pck` puts the resource pack inside the
; executable and `dotnet/embed_build_outputs` puts the .NET assemblies inside the pack, so
; there is no `.pck` and no `data_Hexcom_windows_x86_64/` beside it. Without those two the
; export is three things that have to travel together, and the test the brief set is a thing
; a person can copy to another folder and double-click.
;
; `debug/export_console_wrapper=2` also writes `Hexcom.console.exe` next to it, which is the
; same game with stdout kept on the terminal — the exported twin of
; `Godot_v4.7.2-stable_mono_win64_console`, and the one to run when a capture has to report
; where it wrote to.
;
; `export_path` is empty deliberately. The destination is given on the command line, so the
; repository never records a path off this machine.

[preset.0]

